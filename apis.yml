apis:
- name: Oishii Storefront MCP Server
  description: >-
    Anonymous, live Model Context Protocol server for the Oishii storefront, served from oishii.com and provided by the
    Shopify storefront-renderer platform. A tools/list call returns five tools with full JSON Schema input contracts:
    search_catalog (natural-language and filtered product search with cursor pagination), get_product_details,
    get_cart, update_cart, and search_shop_policies_and_faqs. Responses conform to the UCP catalog capabilities
    (dev.ucp.shopping.catalog.search / dev.ucp.shopping.catalog.lookup). No authentication is required for tools/list.
  humanURL: https://oishii.com/agents.md
  baseURL: https://oishii.com/api/mcp
  tags:
  - MCP
  - Agent Commerce
  - E-Commerce
  - Catalog
  - Shopify
  tags_raw:
  - MCP
  - Agent Commerce
  - Ecommerce
  - Catalog
  - Shopify
  properties:
  - type: MCPServer
    url: mcp/oishii-mcp.yml
  - type: Documentation
    url: https://oishii.com/agents.md
  - type: LLMsTxt
    url: llms/oishii-llms.txt
- name: Oishii UCP Agentic Commerce Endpoint
  description: >-
    Universal Commerce Protocol (UCP) endpoint for agent-driven purchasing from the Oishii store, advertised in the
    merchant profile at https://oishii.com/.well-known/ucp with supported protocol versions 2026-04-08 and 2026-01-23.
    It declares the cart, checkout, fulfillment, discount, order and catalog capabilities, plus Google Pay and Shopify
    card payment handlers. The MCP transport at /api/ucp/mcp is gated: an unauthenticated tools/list returns HTTP 422
    with JSON-RPC error -32001 invalid_profile_url, because UCP requires the calling agent to present a profile URI.
    Checkout completion requires contemporaneous human buyer approval.
  humanURL: https://oishii.com/.well-known/ucp
  baseURL: https://oishii.com/api/ucp/mcp
  tags:
  - Universal Commerce Protocol
  - Agent Commerce
  - Checkout
  - Payments
  - MCP
  properties:
  - type: Documentation
    url: https://oishii.com/agents.md
  - type: WellKnown
    url: well-known/oishii-well-known.yml
