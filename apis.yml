aid: oishii
name: Oishii
description: >-
  Oishii is a US vertical-farming company founded in 2016 and headquartered in Jersey City, New Jersey, that grows
  pesticide-free Japanese strawberry varieties — the Omakase Berry and Koyo Berry — plus the Rubi Tomato inside
  robot-assisted, bee-pollinated indoor "Smart Farms" in New Jersey, and sells them direct-to-consumer and through
  grocery retail across the United States and Canada. Oishii publishes no traditional developer program, but its
  direct-to-consumer storefront at oishii.com runs on Shopify and therefore exposes a real, anonymous, machine-readable
  agent-commerce surface: an /agents.md and /llms.txt agent instruction document, a Universal Commerce Protocol (UCP)
  merchant profile at /.well-known/ucp, OAuth 2.0 and OpenID Connect discovery documents, a live storefront MCP server
  at /api/mcp exposing catalog search, cart, product-detail and policy-lookup tools, and a UCP checkout MCP endpoint at
  /api/ucp/mcp that is gated behind an agent profile URI.
