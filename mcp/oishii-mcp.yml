tools:
- name: search_catalog
  server: oishii-storefront-mcp
  description: >-
    Search for products from the online store using natural language queries, filter criteria, or both.
    At least one of query or filters must be provided. Results are cursor-paginated. Responses conform to
    the UCP catalog search capability (dev.ucp.shopping.catalog.search).
  input_schema: oishii-storefront-mcp-tools.json#/result/tools/0/inputSchema
  parameters:
  - catalog.query
  - catalog.context.address_country
  - catalog.context.address_region
  - catalog.context.postal_code
  - catalog.context.language
  - catalog.context.currency
  - catalog.context.intent
  - catalog.filters.categories
  - catalog.filters.price.min
  - catalog.filters.price.max
  - catalog.pagination.cursor
  - catalog.pagination.limit
  - meta.ucp-agent.profile
- name: get_product_details
  server: oishii-storefront-mcp
  description: >-
    Look up a product by ID (gid://shopify/Product/123), optionally selecting a specific variant via
    options, with country/language localization.
  input_schema: oishii-storefront-mcp-tools.json#/result/tools/4/inputSchema
  required:
  - product_id
- name: get_cart
  server: oishii-storefront-mcp
  description: >-
    Get the cart including items, shipping options, discount info, and checkout URL for a given cart id.
  input_schema: oishii-storefront-mcp-tools.json#/result/tools/1/inputSchema
  required:
  - cart_id
- name: update_cart
  server: oishii-storefront-mcp
  description: >-
    Add, update, or remove cart line items and set buyer information, shipping details, discount codes and
    notes. Creates a new cart when cart_id is omitted. Quantity 0 removes a line.
  input_schema: oishii-storefront-mcp-tools.json#/result/tools/2/inputSchema
- name: search_shop_policies_and_faqs
  server: oishii-storefront-mcp
  description: >-
    Natural-language retrieval over the store's policies, products and services (shipping, refunds,
    privacy, terms, FAQ).
  input_schema: oishii-storefront-mcp-tools.json#/result/tools/3/inputSchema
  required:
  - query
gated_tools:
  server: oishii-ucp-mcp
  note: >-
    Names and flow order are published in /agents.md and /llms.txt; input schemas require an authenticated
    UCP agent profile and were NOT observed. Do not treat these as verified contracts.
  names:
  - search_catalog
  - create_cart
  - create_checkout
  - update_checkout
  - complete_checkout
rules:
- Checkout requires contemporaneous human buyer approval; agents must not complete payment autonomously.
- The MCP endpoint is rate limited per IP; back off on HTTP 429.
- Pass context.address_country and context.currency for accurate pricing and availability.
