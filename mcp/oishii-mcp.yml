source: https://oishii.com/agents.md
note: >-
  Two distinct MCP endpoints are served from oishii.com. The storefront MCP server at /api/mcp answers
  an anonymous tools/list with five tools and complete JSON Schema input contracts (captured verbatim in
  oishii-storefront-mcp-tools.json). The UCP commerce MCP endpoint at /api/ucp/mcp — the one advertised in
  /agents.md, /llms.txt and /.well-known/ucp — is gated: an unauthenticated tools/list returns HTTP 422
  with JSON-RPC error -32001 invalid_profile_url because UCP requires the calling agent to present an agent
  profile URI. Both are provided by the Shopify platform (serverInfo name "storefront-renderer" version
  0.1.0) and served from Oishii's own host.
