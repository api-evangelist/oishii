note: >-
  Oishii publishes no error reference and no OpenAPI, so this catalog records only error envelopes that
  were actually observed on the live endpoints, plus the one failure mode the published agent instructions
  document. It is deliberately short — it is evidence, not a complete registry.
envelope:
